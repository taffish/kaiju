[package]
name = "kaiju"
kind = "tool"
version = "1.10.3"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/kaiju"

[command]
name = "taf-kaiju"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/kaiju:1.10.3-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["metagenomics", "taxonomy-classification", "microbiome", "protein-search", "database-indexing"]
keywords = ["Kaiju", "metagenomics", "metatranscriptomics", "taxonomic classification", "protein database", "FM-index", "NCBI taxonomy", "KaijuP", "KaijuX", "Krona"]
description = "Kaiju 1.10.3 runtime for protein-level taxonomic classification, database construction, and taxonomy-aware result conversion."

[upstream]
name = "Kaiju"
type = "github"
repo = "bioinformatics-centre/kaiju"
homepage = "https://bioinformatics-centre.github.io/kaiju/"
manual = "https://github.com/bioinformatics-centre/kaiju/blob/v1.10.3/README.md"
release_url = "https://github.com/bioinformatics-centre/kaiju/releases/tag/v1.10.3"
downloads = "https://github.com/bioinformatics-centre/kaiju/archive/refs/tags/v1.10.3.tar.gz"
version = "1.10.3"
license = "GPL-3.0-or-later"
commit = "a36cd21d1c04d17a4f7e3744c17e8e8508e69e3b"
citation = "Menzel, Ng, and Krogh 2016, Fast and sensitive taxonomic classification for metagenomics with Kaiju, Nature Communications 7:11257"
doi = "10.1038/ncomms11257"
pmid = "27071849"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["kaiju", "kaiju-multi", "kaijup", "kaijux", "kaiju2krona", "kaiju2table", "kaiju-addTaxonNames", "kaiju-mergeOutputs", "kaiju-convertNR", "kaiju-convertRefSeq", "kaiju-mkbwt", "kaiju-mkfmi", "kaiju-makedb", "kaiju-gbk2faa.pl", "kaiju-db", "python3", "perl", "curl", "wget", "awk", "xargs", "tar", "gzip", "gunzip", "bzip2", "bunzip2", "xz", "unxz", "find", "dirname", "mkdir", "cat", "wc", "seq", "grep", "sed", "sort", "sh", "ldd"]
test = ["grep -F 'source_sha256=712dc0b73944349ddf0e49b61e780864244e901ca89cd5c80180a97130a724d5' /opt/kaiju/share/doc/kaiju/source.txt >/dev/null && grep -F 'upstream_commit=a36cd21d1c04d17a4f7e3744c17e8e8508e69e3b' /opt/kaiju/share/doc/kaiju/source.txt >/dev/null && grep -F 'runtime_banner_version=1.10.3' /opt/kaiju/share/doc/kaiju/source.txt >/dev/null", "/opt/kaiju/share/testdata/kaiju-smoke.sh interfaces /tmp/taf-kaiju-index-interfaces-$$", "/opt/kaiju/share/testdata/kaiju-smoke.sh buildtime /tmp/taf-kaiju-index-buildtime-$$", "/opt/kaiju/share/testdata/kaiju-smoke.sh classify /tmp/taf-kaiju-index-classify-$$", "/opt/kaiju/share/testdata/kaiju-smoke.sh postprocess /tmp/taf-kaiju-index-postprocess-$$", "/opt/kaiju/share/testdata/kaiju-smoke.sh index /tmp/taf-kaiju-index-build-$$", "/opt/kaiju/share/testdata/kaiju-smoke.sh gbk /tmp/taf-kaiju-index-gbk-$$", "python3 /opt/kaiju/share/testdata/kaiju-resource-smoke.py upstream", "python3 /opt/kaiju/share/testdata/kaiju-resource-smoke.py resources"]
